name: Core code checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_sources.py
      - run: python scripts/run_tests.py
      - run: python scripts/run_example.py --study main --include-lns --output outputs/main
      - run: python scripts/run_example.py --study construction --output outputs/construction
      - run: python scripts/run_example.py --study service --output outputs/service
